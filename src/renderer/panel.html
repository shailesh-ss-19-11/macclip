<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:">
  <title>Clipboard History</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div class="panel" role="dialog" aria-label="Clipboard history">
    <div class="search">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="6.5" cy="6.5" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 10l4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <input id="query" type="text" placeholder="Search clipboard history" aria-label="Search clipboard history" autocomplete="off" spellcheck="false">
    </div>
    <div class="tabs" role="tablist" aria-label="View">
      <button id="tab-history" role="tab" aria-selected="true">History</button>
      <button id="tab-snippets" role="tab" aria-selected="false">Snippets</button>
    </div>
    <div id="banner" class="banner" hidden></div>
    <div id="list" class="list" role="listbox" aria-label="Clipboard items" tabindex="-1"></div>
    <div class="footer">
      <span id="count" class="count"></span>
      <span id="hints" class="hints"></span>
      <button id="clear" class="linkbtn" title="Clear unpinned history">Clear</button>
      <button id="settings" class="icon" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="8" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M12.6 3.4l-1.4 1.4M4.8 11.2l-1.4 1.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
  <script src="../shared/historyView.js"></script>
  <script src="panel.js"></script>
</body>
</html>
