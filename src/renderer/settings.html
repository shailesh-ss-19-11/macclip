<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:">
  <title>MacClip Settings</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <header><h1>MacClip Settings</h1></header>
  <main>
    <div class="card">
      <div class="field"><label for="shortcut">Open clipboard history</label>
        <div class="grow"><button id="shortcut" class="recorder" aria-describedby="shortcut-msg">⌥V</button></div></div>
      <p id="shortcut-msg" class="msg" role="status"></p>
      <div class="field"><label for="paste">When you pick an item</label>
        <div class="grow"><select id="paste"><option value="copyAndPaste">Copy and paste it</option><option value="copyOnly">Only copy it</option></select></div></div>
      <div class="field" id="ax-row"><label>Permission to paste</label>
        <div class="grow"><span id="ax-status"></span> <button id="ax-btn" class="btn">Allow…</button></div></div>
      <div class="field"><label for="limit">History size</label>
        <div class="grow"><select id="limit"><option value="100">100 items</option><option value="500">500 items</option><option value="1000">1,000 items</option></select></div></div>
      <div class="field"><label for="launch">Open at login</label><div class="grow"><input id="launch" type="checkbox" role="switch"></div></div>
      <p id="launch-note" class="msg" hidden>Works once MacClip is installed in Applications.</p>
      <div class="field"><label for="shots">Copy screenshots automatically</label><div class="grow"><input id="shots" type="checkbox" role="switch"></div></div>
      <div class="field"><label for="paused">Pause (stop saving copies)</label><div class="grow"><input id="paused" type="checkbox" role="switch"></div></div>
    </div>

    <div class="card">
      <div class="field"><label>Delete all history</label><div class="grow"><button id="clear-all" class="btn danger">Delete…</button></div></div>
    </div>

    <p class="foot">Everything stays on this Mac; nothing is sent anywhere. Password managers and things that look like keys or card numbers are never saved. macOS can’t always tell what is sensitive, so use Pause when working with secrets.</p>
  </main>
  <script src="../shared/accelerator.js"></script>
  <script src="settings.js"></script>
</body>
</html>
